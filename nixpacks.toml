[phases.setup]
nixPkgs = ["nodejs_20", "python312", "python312Packages.pip", "espeak-ng"]

[phases.install]
cmds = ["npm ci", "pip install -r requirements.txt --break-system-packages"]

[phases.build]
cmds = ["chmod +x Rhubarb-Lip-Sync-1.14.0-Linux/rhubarb && npm run railway:build"]

[start]
cmd = "node server/index.js"
